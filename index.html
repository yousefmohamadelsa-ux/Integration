<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول بـ Google</title>
    <!-- تحميل مكتبة Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #1a1a2e;
            margin-bottom: 30px;
        }
        #g_id_signin {
            display: flex;
            justify-content: center;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 تسجيل الدخول بـ Google</h1>
        
        <!-- زر تسجيل الدخول -->
        <div id="g_id_signin"></div>
        
        <div id="statusMessage" class="status"></div>
    </div>

    <script>
        // ============================================================
        // دالة معالجة الاستجابة من Google
        // ============================================================
        function handleCredentialResponse(response) {
            console.log("✅ تم استلام التوكن:", response.credential);
            
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = 'status success';
            statusDiv.textContent = '✅ تم تسجيل الدخول بنجاح!';
            
            // هنا يمكنك إرسال التوكن إلى الخادم أو استخدامه مع Firebase
            // مثال: firebase.auth().signInWithCredential(credential)
        }

        // ============================================================
        // تهيئة زر Google
        // ============================================================
        window.onload = function() {
            console.log('⏳ جاري تهيئة زر Google...');
            
            // التحقق من تحميل المكتبة
            if (typeof google === 'undefined') {
                console.error('❌ مكتبة Google لم يتم تحميلها');
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.className = 'status error';
                statusDiv.textContent = '⚠️ فشل تحميل مكتبة Google. تأكد من اتصال الإنترنت.';
                return;
            }

            try {
                google.accounts.id.initialize({
                    client_id: '358188138966-0fjp4adkc3t2ibj9iveka5kmf0a0h4v2.apps.googleusercontent.com',
                    callback: handleCredentialResponse, // ✅ الدالة التي سيتم استدعاؤها
                    context: 'signin',
                    ux_mode: 'popup',
                    auto_prompt: false,
                    // يمكن إضافة هذه الخيارات لتخصيص الزر بشكل أكبر
                    // itp_support: true,
                });

                google.accounts.id.renderButton(
                    document.getElementById('g_id_signin'),
                    {
                        type: 'standard',
                        shape: 'pill',
                        theme: 'outline',
                        text: 'signin_with',
                        size: 'large',
                        logo_alignment: 'left',
                        // width: 300
                    }
                );

                console.log('✅ تم تهيئة زر Google بنجاح');
            } catch (error) {
                console.error('❌ خطأ في تهيئة Google:', error);
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.className = 'status error';
                statusDiv.textContent = '⚠️ حدث خطأ في تهيئة زر Google';
            }
        };
        
    </script>
</body>
</html>
